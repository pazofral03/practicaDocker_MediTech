{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h2 class="fw-bold text-primary">🗓️ Mi Agenda</h2>
            <p class="text-muted">Consulta y gestiona tus citas programadas.</p>
        </div>
        <div class="col-md-6 text-end">
            <a href="{{ url_for('citas.medico_ausencias') }}" class="btn btn-warning me-2">🏖️ Registrar Ausencia</a>
            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Volver al Panel</a>
        </div>
    </div>

    <!-- Leyenda de colores -->
    <div class="mb-3">
        <span class="badge bg-primary me-2">Pendiente</span>
        <span class="badge bg-info me-2 text-dark">Confirmada</span>
        <span class="badge bg-success me-2">Completada</span>
        <span class="badge bg-danger">Cancelada</span>
    </div>

    <!-- Contenedor del Calendario -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div id="calendar" class="p-3"></div>
        </div>
    </div>
</div>

<!-- FullCalendar Libraries -->
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
<script>

    document.addEventListener('DOMContentLoaded', function () {
        var calendarEl = document.getElementById('calendar');
        var calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            locale: 'es',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            navLinks: true, // can click day/week names to navigate views
            businessHours: true, // display business hours
            editable: false,
            selectable: false,
            events: '/api/citas/medico', // Fetch events from our API

            // Customize event content
            eventContent: function (arg) {
                return {
                    html: `
                        <div class="overflow-hidden">
                            <b>${arg.timeText}</b>
                            <i>${arg.event.title}</i>
                            <br>
                            <small>${arg.event.extendedProps.motivo ? arg.event.extendedProps.motivo.substring(0, 20) + '...' : ''}</small>
                        </div>
                    `
                };
            },

            eventClick: function (info) {
                if (info.event.url) {
                    window.location.href = info.event.url;
                    info.jsEvent.preventDefault(); // prevents browser from following link in current tab.
                }
            }
        });
        calendar.render();
    });

</script>

<style>
    /* Ajustes para FullCalendar */
    .fc-event {
        cursor: pointer;
        transition: transform .1s;
    }

    .fc-event:hover {
        transform: scale(1.02);
        z-index: 5;
    }

    #calendar {
        min-height: 700px;
    }
</style>
{% endblock %}
