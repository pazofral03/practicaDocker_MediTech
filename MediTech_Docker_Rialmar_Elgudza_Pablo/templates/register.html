{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-lg border-0 rounded-lg">
            <div class="card-header bg-success text-white text-center py-4">
                <h3 class="mb-0 fw-bold">📝 Registro de Usuario</h3>
                <p class="mb-0 text-white-50">Crea tu cuenta en MediTech</p>
            </div>
            <div class="card-body p-5">

                <form method="POST">
                    <!-- Datos Generales -->
                    <h6 class="text-uppercase text-muted fw-bold mb-3">Datos de Cuenta</h6>
                    <div class="mb-3">
                        <label class="form-label">Nombre Completo</label>
                        <input type="text" name="nombre_completo" class="form-control" required
                            placeholder="Ej: Juan Pérez" value="{{ request.form.get('nombre_completo', '') }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required placeholder="nombre@ejemplo.com"
                            value="{{ request.form.get('email', '') }}">
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Confirmar Contraseña</label>
                            <input type="password" name="confirm_password" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Selecciona tu Rol</label>
                        <select name="rol" class="form-select" id="rolSelect" onchange="toggleFields()" required>
                            <option value="" {% if not request.form.get('rol') %}selected{% endif %} disabled>Elige una
                                opción...</option>
                            <option value="paciente" {% if request.form.get('rol')=='paciente' %}selected{% endif %}>
                                Paciente</option>
                            <option value="medico" {% if request.form.get('rol')=='medico' %}selected{% endif %}>Médico
                            </option>
                            <option value="admin" {% if request.form.get('rol')=='admin' %}selected{% endif %}>
                                Administrador</option>
                        </select>
                        <div class="form-text">Esto determinará tus permisos en la plataforma.</div>
                    </div>

                    <!-- Campos Específicos -->
                    <div id="medicoFields" class="d-none border-top pt-3 mt-3 bg-light p-3 rounded">
                        <h6 class="text-uppercase text-info fw-bold mb-3">👨‍⚕️ Datos Profesionales</h6>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Número de Colegiado</label>
                                <input type="text" name="num_colegiado" class="form-control"
                                    value="{{ request.form.get('num_colegiado', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Especialidad</label>
                                <select name="especialidad" class="form-select">
                                    <option value="" selected disabled>Seleccione...</option>
                                    <option value="Medicina General" {% if
                                        request.form.get('especialidad')=='Medicina General' %}selected{% endif %}>
                                        Medicina General</option>
                                    <option value="Pediatría" {% if request.form.get('especialidad')=='Pediatría'
                                        %}selected{% endif %}>Pediatría</option>
                                    <option value="Cardiología" {% if request.form.get('especialidad')=='Cardiología'
                                        %}selected{% endif %}>Cardiología</option>
                                    <option value="Dermatología" {% if request.form.get('especialidad')=='Dermatología'
                                        %}selected{% endif %}>Dermatología</option>
                                    <option value="Ginecología" {% if request.form.get('especialidad')=='Ginecología'
                                        %}selected{% endif %}>Ginecología</option>
                                    <option value="Neurología" {% if request.form.get('especialidad')=='Neurología'
                                        %}selected{% endif %}>Neurología</option>
                                    <option value="Oftalmología" {% if request.form.get('especialidad')=='Oftalmología'
                                        %}selected{% endif %}>Oftalmología</option>
                                    <option value="Psiquiatría" {% if request.form.get('especialidad')=='Psiquiatría'
                                        %}selected{% endif %}>Psiquiatría</option>
                                    <option value="Traumatología" {% if
                                        request.form.get('especialidad')=='Traumatología' %}selected{% endif %}>
                                        Traumatología</option>
                                    <option value="Otorrinolaringología" {% if
                                        request.form.get('especialidad')=='Otorrinolaringología' %}selected{% endif %}>
                                        Otorrinolaringología</option>
                                    <option value="Urología" {% if request.form.get('especialidad')=='Urología'
                                        %}selected{% endif %}>Urología</option>
                                    <option value="Endocrinología" {% if
                                        request.form.get('especialidad')=='Endocrinología' %}selected{% endif %}>
                                        Endocrinología</option>
                                    <option value="Gastroenterología" {% if
                                        request.form.get('especialidad')=='Gastroenterología' %}selected{% endif %}>
                                        Gastroenterología</option>
                                    <option value="Neumología" {% if request.form.get('especialidad')=='Neumología'
                                        %}selected{% endif %}>Neumología</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Disponibilidad Inicial</label>
                            <select name="disponibilidad" class="form-select">
                                <option value="" selected disabled>Seleccione un horario...</option>
                                <option value="08:00 - 16:00" {% if request.form.get('disponibilidad')=='08:00 - 16:00'
                                    %}selected{% endif %}>08:00 - 16:00</option>
                                <option value="09:00 - 17:00" {% if request.form.get('disponibilidad')=='09:00 - 17:00'
                                    %}selected{% endif %}>09:00 - 17:00</option>
                                <option value="12:00 - 20:00" {% if request.form.get('disponibilidad')=='12:00 - 20:00'
                                    %}selected{% endif %}>12:00 - 20:00</option>
                                <option value="16:00 - 00:00" {% if request.form.get('disponibilidad')=='16:00 - 00:00'
                                    %}selected{% endif %}>16:00 - 00:00</option>
                            </select>
                        </div>
                    </div>

                    <div id="pacienteFields" class="d-none border-top pt-3 mt-3 bg-light p-3 rounded">
                        <h6 class="text-uppercase text-secondary fw-bold mb-3">😷 Datos Personales</h6>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">NSS (Seguridad Social)</label>
                                <input type="text" name="nss" class="form-control"
                                    value="{{ request.form.get('nss', '') }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control"
                                    value="{{ request.form.get('telefono', '') }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" name="direccion" class="form-control" placeholder="Dirección completa"
                                value="{{ request.form.get('direccion', '') }}">
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-success btn-lg">Registrarse</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-white">
                <div class="small">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}" class="fw-bold">Inicia
                        Sesión aquí</a></div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        const rol = document.getElementById('rolSelect').value;
        const medicoFields = document.getElementById('medicoFields');
        const pacienteFields = document.getElementById('pacienteFields');

        medicoFields.classList.add('d-none');
        pacienteFields.classList.add('d-none');

        // Quitamos 'required' de los inputs ocultos para evitar problemas de validación
        enableInputs(medicoFields, false);
        enableInputs(pacienteFields, false);

        if (rol === 'medico') {
            medicoFields.classList.remove('d-none');
            enableInputs(medicoFields, true);
        } else if (rol === 'paciente') {
            pacienteFields.classList.remove('d-none');
            enableInputs(pacienteFields, true);
        }
    }

    function enableInputs(container, shouldEnable) {
        const inputs = container.querySelectorAll('input, select');
        inputs.forEach(input => {
            if (shouldEnable) {
                // Podríamos poner required si fuera estricto, pero mejor lo dejamos opcional o validamos en backend
                // input.setAttribute('required', ''); 
            } else {
                input.removeAttribute('required');
                input.value = ''; // Limpiar si se oculta
            }
        });
    }

    // Ejecutar al inicio
    document.addEventListener("DOMContentLoaded", function () {
        toggleFields();
    });
</script>
{% endblock %}
