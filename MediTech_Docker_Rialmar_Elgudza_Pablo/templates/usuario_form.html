{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    {% if usuario %}✏️ Editar Usuario{% else %}➕ Crear Nuevo Usuario{% endif %}
                </h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <!-- Campos Comunes -->
                    <h6 class="text-uppercase text-muted fw-bold mb-3">Datos Generales</h6>
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" name="nombre_completo" class="form-control"
                                value="{{ usuario.nombre_completo if usuario else '' }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control"
                                value="{{ usuario.email if usuario else '' }}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" {% if not usuario or not
                                usuario.id %}required{% endif %}
                                placeholder="{{ 'Dejar en blanco para mantener actual' if usuario and usuario.id else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Rol</label>
                            <select name="rol" class="form-select" id="rolSelect" onchange="toggleFields()" required>
                                <option value="">Seleccionar...</option>
                                <option value="admin" {% if usuario and usuario.rol=='admin' %}selected{% endif %}>
                                    Administrador</option>
                                <option value="medico" {% if usuario and usuario.rol=='medico' %}selected{% endif %}>
                                    Médico</option>
                                <option value="paciente" {% if usuario and usuario.rol=='paciente' %}selected{% endif
                                    %}>Paciente</option>
                            </select>
                        </div>
                    </div>

                    <!-- Campos Específicos -->
                    <div id="medicoFields" class="d-none border-top pt-3 mt-3">
                        <h6 class="text-uppercase text-primary fw-bold mb-3">Datos de Médico</h6>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Número de Colegiado</label>
                                <input type="text" name="num_colegiado" class="form-control"
                                    value="{{ usuario.num_colegiado if usuario else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Especialidad</label>
                                <select name="especialidad" class="form-select">
                                    <option value="" selected disabled>Seleccione...</option>
                                    <option value="Medicina General" {% if usuario and
                                        usuario.especialidad=='Medicina General' %}selected{% endif %}>Medicina General
                                    </option>
                                    <option value="Pediatría" {% if usuario and usuario.especialidad=='Pediatría'
                                        %}selected{% endif %}>Pediatría</option>
                                    <option value="Cardiología" {% if usuario and usuario.especialidad=='Cardiología'
                                        %}selected{% endif %}>Cardiología</option>
                                    <option value="Dermatología" {% if usuario and usuario.especialidad=='Dermatología'
                                        %}selected{% endif %}>Dermatología</option>
                                    <option value="Ginecología" {% if usuario and usuario.especialidad=='Ginecología'
                                        %}selected{% endif %}>Ginecología</option>
                                    <option value="Neurología" {% if usuario and usuario.especialidad=='Neurología'
                                        %}selected{% endif %}>Neurología</option>
                                    <option value="Oftalmología" {% if usuario and usuario.especialidad=='Oftalmología'
                                        %}selected{% endif %}>Oftalmología</option>
                                    <option value="Psiquiatría" {% if usuario and usuario.especialidad=='Psiquiatría'
                                        %}selected{% endif %}>Psiquiatría</option>
                                    <option value="Traumatología" {% if usuario and
                                        usuario.especialidad=='Traumatología' %}selected{% endif %}>Traumatología
                                    </option>
                                    <option value="Otorrinolaringología" {% if usuario and
                                        usuario.especialidad=='Otorrinolaringología' %}selected{% endif %}>
                                        Otorrinolaringología</option>
                                    <option value="Urología" {% if usuario and usuario.especialidad=='Urología'
                                        %}selected{% endif %}>Urología</option>
                                    <option value="Endocrinología" {% if usuario and
                                        usuario.especialidad=='Endocrinología' %}selected{% endif %}>Endocrinología
                                    </option>
                                    <option value="Gastroenterología" {% if usuario and
                                        usuario.especialidad=='Gastroenterología' %}selected{% endif %}>
                                        Gastroenterología</option>
                                    <option value="Neumología" {% if usuario and usuario.especialidad=='Neumología'
                                        %}selected{% endif %}>Neumología</option>
                                </select>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Disponibilidad</label>
                            <select name="disponibilidad" class="form-select">
                                <option value="" selected disabled>Seleccione un horario...</option>
                                <option value="08:00 - 16:00" {% if usuario and usuario.disponibilidad=='08:00 - 16:00'
                                    %}selected{% endif %}>08:00 - 16:00</option>
                                <option value="09:00 - 17:00" {% if usuario and usuario.disponibilidad=='09:00 - 17:00'
                                    %}selected{% endif %}>09:00 - 17:00</option>
                                <option value="12:00 - 20:00" {% if usuario and usuario.disponibilidad=='12:00 - 20:00'
                                    %}selected{% endif %}>12:00 - 20:00</option>
                                <option value="16:00 - 00:00" {% if usuario and usuario.disponibilidad=='16:00 - 00:00'
                                    %}selected{% endif %}>16:00 - 00:00</option>
                            </select>
                        </div>
                    </div>

                    <div id="pacienteFields" class="d-none border-top pt-3 mt-3">
                        <h6 class="text-uppercase text-success fw-bold mb-3">Datos de Paciente</h6>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">NSS (Seguridad Social)</label>
                                <input type="text" name="nss" class="form-control"
                                    value="{{ usuario.nss if usuario else '' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Teléfono</label>
                                <input type="text" name="telefono" class="form-control"
                                    value="{{ usuario.telefono if usuario else '' }}">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección</label>
                            <input type="text" name="direccion" class="form-control"
                                value="{{ usuario.direccion if usuario else '' }}">
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('usuarios.index') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            {% if usuario %}💾 Guardar Cambios{% else %}✨ Crear Usuario{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleFields() {
        const rol = document.getElementById('rolSelect').value;
        const medicoFields = document.getElementById('medicoFields');
        const pacienteFields = document.getElementById('pacienteFields');

        medicoFields.classList.add('d-none');
        pacienteFields.classList.add('d-none');

        if (rol === 'medico') {
            medicoFields.classList.remove('d-none');
        } else if (rol === 'paciente') {
            pacienteFields.classList.remove('d-none');
        }
    }

    // Ejecutar al cargar para editar
    document.addEventListener("DOMContentLoaded", function () {
        toggleFields();
    });
</script>
{% endblock %}
