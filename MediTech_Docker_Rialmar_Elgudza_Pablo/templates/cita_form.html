{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">➕ Solicitar Nueva Cita</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">

                    {% if current_user.rol == 'admin' %}
                    <div class="mb-3">
                        <label class="form-label">Paciente</label>
                        <select name="paciente_id" class="form-select" required>
                            <option value="">Seleccionar Paciente...</option>
                            {% for p in pacientes %}
                            <option value="{{ p.id }}">{{ p.nombre_completo }} ({{ p.email }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}

                    <div class="mb-3">
                        <label class="form-label">Médico</label>
                        <select name="medico_id" class="form-select" required>
                            <option value="">Seleccionar Médico...</option>
                            {% for m in medicos %}
                            <option value="{{ m.id }}">{{ m.nombre_completo }} - {{ m.especialidad }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Fecha</label>
                            <input type="date" name="fecha" class="form-control" required id="fechaInput">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Hora</label>
                            <div class="input-group mb-2">
                                <span class="input-group-text"><i class="fas fa-clock"></i></span>
                                <input type="time" name="hora" id="horaInputTime" class="form-control" required
                                    value="09:00" step="900">
                            </div>

                            <label class="form-label small text-muted">Desliza para ajustar (Cada 15 minutos)</label>
                            <input type="range" class="form-range" min="8" max="20" step="0.25" id="horaRange"
                                value="9">
                            <!-- Hidden input was removed as we use the time input directly now -->
                            <div class="d-flex justify-content-between small text-muted">
                                <span>08:00</span>
                                <span>14:00</span>
                                <span>20:00</span>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Motivo de la Consulta</label>
                        <textarea name="motivo_consulta" class="form-control" rows="3" required
                            placeholder="Describe brevemente tus síntomas o razón de la visita"></textarea>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                        <a href="{{ url_for('citas.index') }}" class="btn btn-secondary me-md-2">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Confirmar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Validación fecha mínima
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('fechaInput').setAttribute('min', today);

        // Lógica del deslizador de hora
        const horaRange = document.getElementById('horaRange');
        const horaInputTime = document.getElementById('horaInputTime');

        function updateFromSlider() {
            let val = parseFloat(horaRange.value);
            let hours = Math.floor(val);
            let decimalPart = val - hours;
            let minutes = Math.round(decimalPart * 60);

            // Format HH:MM
            let timeStr = (hours < 10 ? '0' : '') + hours + ':' + (minutes < 10 ? '0' : '') + minutes;
            horaInputTime.value = timeStr;
        }

        function updateFromInput() {
            let parts = horaInputTime.value.split(':');
            if (parts.length === 2) {
                let hours = parseInt(parts[0]);
                let minutes = parseInt(parts[1]);
                let val = hours + (minutes / 60);
                horaRange.value = val;
            }
        }

        horaRange.addEventListener('input', updateFromSlider);
        horaInputTime.addEventListener('input', updateFromInput);

        // Inicializar
        updateFromSlider();
    });
</script>
{% endblock %}
